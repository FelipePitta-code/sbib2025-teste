# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
  branches:
    include:
      - producao

pool:
  name: linux-agent
  demands:
    - npm

variables:
- name: NODE_VERSION
  value: '22.x'
- name: CI
  value: false

stages:
  - stage: Build
    displayName: Build and Test
    jobs:
      - job: Build_Job
        displayName: 'Build Next Application'
        steps: 
          - task: NodeTool@0
            displayName: 'Use Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: $(NODE_VERSION)
          - script: npm install
            displayName: 'Install dependencies'
          - script: npm run build
            displayName: 'Build application'
          
          - task: ArchiveFiles@2
            displayName: 'Archive build files'
            inputs:
              rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
              replaceExistingArchive: true
              verbose: true
            
  - stage: Deploy
    displayName: 'Deploy Application'
    dependsOn: Build
    condition: succeeded()
    jobs:
    - deployment: Deploy_to_Server # Usar um "deployment job" é a prática recomendada
      displayName: 'Deploy to Apache Server'
      environment: 'Producao-Servidor-Web' # Crie este ambiente no menu Pipelines -> Environments
      strategy:
        runOnce:
          deploy:
            steps:
            - download: none
            - task: CopyFiles@2
              displayName: 'Copia arquivos para o diretório /sbib.biocodejr.com.br/'
              inputs:
                Contents: '**'
                TargetFolder: '/var/www/sbib.biocodejr.com.br/'
                CleanTargetFolder: true
            - task: Bash@3
              displayName: 'pm2 config'
              inputs:
                targetType: 'inline'
                script: |
                  echo '-> Diretório atual:'
                  pwd
                  echo '-> Arquivos:'
                  ls -la
                  echo '-> npm install --production:'
                  npm install
                  npm run build
                  pm2 reload sbib.biocodejr || pm2 start npm --name "sbib.biocodejr" -- start
                  pm2 save